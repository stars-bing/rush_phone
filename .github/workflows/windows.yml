name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'rush_phone/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'rush_phone/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and verify Windows package
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: RushPhone-Windows-x64
          path: |
            dist/RushPhone-Windows-x64.zip
            dist/RushPhone-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
